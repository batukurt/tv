<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0d13">
  <title>AFL TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-base: #0b0d13;
      --bg-surface: #141721;
      --bg-card: #1c2130;
      --bg-card-hover: #262c40;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.45);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #23293b;
      --header-h: 40px;
      --bar-hint-h: 22px;
      --np-bar-h: 44px;
      --row-h: 24px;
      --sidebar-w: 320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    header {
      height: var(--header-h);
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .search-box {
      width: 240px;
    }

    .search-box input {
      width: 100%;
      height: 26px;
      padding: 0 8px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background-color: var(--bg-base);
      color: var(--text);
      font-size: 0.78rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .shortcuts-bar {
      height: var(--bar-hint-h);
      background: #11141d;
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      font-size: 0.68rem;
      color: var(--text-muted);
      flex-shrink: 0;
      align-items: center;
    }

    .shortcuts-bar span {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    kbd {
      background: #1e2433;
      border: 1px solid #333c52;
      color: #cbd5e1;
      padding: 0 3px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .stage {
      flex: 1 1 0%;
      min-height: 0;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    .player-section {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
      background: #000;
      position: relative;
    }

    .video-viewport {
      flex: 1 1 0%;
      min-height: 0;
      position: relative;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #fullscreen-gate {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.65);
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: opacity 0.25s ease;
    }

    #fullscreen-gate .btn {
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 9999px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    .now-playing-bar {
      height: var(--np-bar-h);
      padding: 0 14px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      z-index: 85;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .player-section:fullscreen .video-viewport,
    .player-section:-webkit-full-screen .video-viewport {
      height: 100% !important;
      width: 100% !important;
      flex: 1 1 100% !important;
    }

    .player-section:fullscreen .now-playing-bar,
    .player-section:-webkit-full-screen .now-playing-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 17, 23, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    .player-section:fullscreen .now-playing-bar.reveal-bar,
    .player-section:-webkit-full-screen .now-playing-bar.reveal-bar {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .player-section:fullscreen.hide-cursor,
    .player-section:-webkit-full-screen.hide-cursor {
      cursor: none;
    }

    .np-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .np-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      background: #fff;
      border-radius: 4px;
      padding: 2px;
      flex-shrink: 0;
    }

    .np-text {
      min-width: 0;
    }

    .np-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .np-category {
      font-size: 0.68rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .res-badge {
      display: none;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(37, 99, 235, 0.6);
      color: #93c5fd;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 1px 4px;
      border-radius: 3px;
      line-height: 1;
    }

    .res-badge.active {
      display: inline-block;
    }

    .player-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .vol-group {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .vol-indicator {
      font-size: 0.72rem;
      font-weight: 600;
      color: #cbd5e1;
      padding: 0 4px;
      min-width: 38px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .vol-indicator.muted {
      color: #f87171;
    }

    .action-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0 8px;
      height: 28px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.74rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      line-height: 1;
      position: relative;
    }

    .action-btn.btn-sm {
      padding: 0 6px;
      font-size: 0.7rem;
    }

    .action-btn:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--accent);
    }

    .action-btn:active {
      transform: translateY(1px);
    }

    .btn-kbd {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      padding: 1px 3px;
      font-size: 0.62rem;
      color: #94a3b8;
      pointer-events: none;
    }

    #right-hover-zone {
      position: absolute;
      top: 0;
      right: 0;
      width: 30vw;
      height: 100%;
      z-index: 60;
      pointer-events: auto;
    }

    .sidebar {
      position: absolute;
      top: 0;
      right: 0;
      bottom: var(--np-bar-h) !important;
      width: var(--sidebar-w);
      min-height: 0;
      background-color: rgba(17, 20, 29, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 70;
      transform: translateX(100%);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease;
      box-shadow: -6px 0 28px rgba(0, 0, 0, 0.65);
    }

    .sidebar.visible,
    .sidebar:hover {
      transform: translateX(0);
    }

    .sidebar-header {
      height: 28px;
      padding: 0 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .channel-list {
      flex: 1 1 0%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: hidden;
      padding: 3px 4px;
      gap: 1px;
    }

    .flag-divider {
      display: flex;
      align-items: center;
      padding: 2px 6px;
      margin: 2px 0 1px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .flag-icon {
      width: 16px;
      height: 11px;
      border-radius: 1.5px;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
      display: inline-block;
      flex-shrink: 0;
      pointer-events: none;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.1s ease;
      border: 1px solid transparent;
      height: var(--row-h);
      min-height: 18px;
      flex: 1 1 0%;
      line-height: 1;
    }

    .channel-item:hover {
      background-color: var(--bg-card);
    }

    .channel-item.active {
      background-color: var(--bg-card);
      border-color: var(--accent);
      box-shadow: inset 2.5px 0 0 var(--accent);
    }

    .ch-logo-wrap {
      height: 75%;
      max-height: 20px;
      aspect-ratio: 4 / 3;
      border-radius: 2px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      padding: 1px;
      pointer-events: none;
    }

    .ch-logo-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .ch-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
    }

    .ch-name {
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ch-tag {
      font-size: 0.64rem;
      color: var(--text-muted);
      flex-shrink: 0;
      opacity: 0.8;
    }

    #fs-osd-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #fs-osd-container.visible {
      opacity: 1;
    }

    .fs-top-hud {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.88) 0%, transparent 100%);
      pointer-events: auto;
    }

    .fs-current-channel {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .fs-current-channel img {
      width: 34px;
      height: 34px;
      background: #fff;
      border-radius: 5px;
      padding: 2px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .fs-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fs-sub {
      font-size: 0.72rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fs-hud-btn {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 5px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.78rem;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>

  <!-- Reusable SVG Flags -->
  <svg style="display: none;">
    <defs>
      <!-- English (Split US / UK) -->
      <g id="flag-en">
        <svg viewBox="0 0 60 40" width="16" height="11">
          <defs>
            <clipPath id="split-tl"><polygon points="0,0 60,0 0,40"/></clipPath>
            <clipPath id="split-br"><polygon points="60,0 60,40 0,40"/></clipPath>
          </defs>
          <g clip-path="url(#split-tl)">
            <rect width="60" height="40" fill="#b22234"/>
            <path d="M0,3.07h60 M0,9.23h60 M0,15.38h60 M0,21.53h60 M0,27.69h60 M0,33.84h60" stroke="#fff" stroke-width="3.07"/>
            <rect width="24" height="21.5" fill="#3c3b6e"/>
            <circle cx="6" cy="5" r="1" fill="#fff"/>
            <circle cx="12" cy="5" r="1" fill="#fff"/>
            <circle cx="18" cy="5" r="1" fill="#fff"/>
            <circle cx="9" cy="11" r="1" fill="#fff"/>
            <circle cx="15" cy="11" r="1" fill="#fff"/>
            <circle cx="6" cy="16" r="1" fill="#fff"/>
            <circle cx="12" cy="16" r="1" fill="#fff"/>
            <circle cx="18" cy="16" r="1" fill="#fff"/>
          </g>
          <g clip-path="url(#split-br)">
            <rect width="60" height="40" fill="#012169"/>
            <path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,40 M60,0 L0,40" stroke="#c8102e" stroke-width="2"/>
            <path d="M30,0 v40 M0,20 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v40 M0,20 h60" stroke="#c8102e" stroke-width="6"/>
          </g>
          <line x1="0" y1="40" x2="60" y2="0" stroke="#ffffff" stroke-width="1.2"/>
        </svg>
      </g>
      <!-- France -->
      <g id="flag-fr">
        <svg viewBox="0 0 60 40" width="16" height="11">
          <rect width="20" height="40" fill="#002395"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ed2939"/>
        </svg>
      </g>
      <!-- Spain -->
      <g id="flag-es">
        <svg viewBox="0 0 60 40" width="16" height="11">
          <rect width="60" height="40" fill="#aa151b"/><rect y="10" width="60" height="20" fill="#f1bf00"/>
        </svg>
      </g>
      <!-- Germany -->
      <g id="flag-de">
        <svg viewBox="0 0 60 40" width="16" height="11">
          <rect width="60" height="40" fill="#000"/><rect y="13.33" width="60" height="13.33" fill="#dd0000"/><rect y="26.66" width="60" height="13.34" fill="#ffce00"/>
        </svg>
      </g>
      <!-- Luxembourg -->
      <g id="flag-lu">
        <svg viewBox="0 0 60 40" width="16" height="11">
          <rect width="60" height="13.33" fill="#ea141d"/><rect y="13.33" width="60" height="13.33" fill="#fff"/><rect y="26.66" width="60" height="13.34" fill="#00a1de"/>
        </svg>
      </g>
      <!-- Italy -->
      <g id="flag-it">
        <svg viewBox="0 0 60 40" width="16" height="11">
          <rect width="20" height="40" fill="#009246"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ce2b37"/>
        </svg>
      </g>
      <!-- Türkiye -->
      <g id="flag-tr">
        <svg viewBox="0 0 60 40" width="16" height="11">
          <rect width="60" height="40" fill="#e30a17"/>
          <circle cx="23" cy="20" r="10" fill="#fff"/><circle cx="26" cy="20" r="8" fill="#e30a17"/>
          <polygon points="34,20 39,22 37,17 40,14 35,15 33,11 32,16 27,16 31,19 29,24" fill="#fff"/>
        </svg>
      </g>
      <!-- Special Star Flag -->
      <g id="flag-special">
        <svg viewBox="0 0 60 40" width="16" height="11">
          <rect width="60" height="40" fill="#1e293b"/>
          <circle cx="30" cy="20" r="10" fill="#f59e0b"/>
        </svg>
      </g>
    </defs>
  </svg>

  <div id="app">
    <header>
      <div class="brand">
        <div class="live-dot"></div>
        01-05
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search channels (Esc to unfocus)..." autocomplete="off">
      </div>
    </header>

    <div class="shortcuts-bar">
      <span><strong>Shortcuts:</strong></span>
      <span><kbd>Enter</kbd> Start / Fullscreen</span>
      <span><kbd>Space</kbd> Play / Pause</span>
      <span><kbd>M</kbd> Mute</span>
      <span><kbd>◀</kbd>/<kbd>▶</kbd> Prev/Next</span>
      <span><kbd>▲</kbd>/<kbd>▼</kbd> Vol</span>
      <span><kbd>E</kbd> 🇬🇧/🇺🇸 EN</span>
      <span><kbd>F</kbd> 🇫🇷 FR</span>
      <span><kbd>S</kbd> 🇪🇸 ES</span>
      <span><kbd>D</kbd>/<kbd>G</kbd> 🇩🇪 DE</span>
      <span><kbd>I/İ</kbd> 🇮🇹 IT</span>
      <span><kbd>L</kbd> 🇱🇺 LU</span>
      <span><kbd>T</kbd> 🇹🇷 TR</span>
      <span><kbd>C</kbd> Channels</span>
      <span><kbd>Esc</kbd> Back</span>
    </div>

    <div class="stage" id="stageContainer">
      <section class="player-section" id="playerContainer">
        <div class="video-viewport" id="viewport">
          <video id="videoPlayer" controls autoplay muted playsinline webkit-playsinline></video>

          <div id="fullscreen-gate">
            <div class="btn">Press [Enter] or Tap Here to Start in Fullscreen and Unmuted</div>
          </div>

          <div id="fs-osd-container">
            <div class="fs-top-hud">
              <div class="fs-current-channel">
                <img id="fsLogo" src="" alt="Channel Logo">
                <div>
                  <div id="fsTitle" class="fs-title">-</div>
                  <div id="fsSub" class="fs-sub">
                    <svg id="fsFlag" class="flag-icon"></svg>
                    <span id="fsCategory">-</span>
                    <span id="fsResBadge" class="res-badge">...</span>
                  </div>
                </div>
              </div>
              <div style="display:flex; gap:6px;">
                <button class="fs-hud-btn" id="fsOpenDrawerBtn">☰ Channels <span class="btn-kbd">C</span></button>
                <button class="fs-hud-btn" id="fsExitBtn">✕ Exit <span class="btn-kbd">Enter</span></button>
              </div>
            </div>
          </div>
        </div>

        <div class="now-playing-bar" id="nowPlayingBar">
          <div class="np-info">
            <img id="npLogo" class="np-logo" src="" alt="Channel Logo">
            <div class="np-text">
              <div id="npTitle" class="np-title">Select channel</div>
              <div id="npCategory" class="np-category">
                <svg id="npFlag" class="flag-icon" style="display:none;"></svg>
                <span id="npCategoryText">-</span>
                <span id="npResBadge" class="res-badge">...</span>
              </div>
            </div>
          </div>
          <div class="player-actions">
            <button class="action-btn" id="playPauseBtn">⏯ Play / Pause <span class="btn-kbd">Space</span></button>
            <button class="action-btn" id="prevChBtn">◀ Prev <span class="btn-kbd">◀</span></button>
            <button class="action-btn" id="nextChBtn"><span class="btn-kbd">▶</span>Next ▶ </button>

            <!-- Bottom Volume Controls & Live % Indicator -->
            <div class="vol-group"><span class="btn-kbd">▼</span>

    function updateVolumeDisplay() {
      if (video.muted) {
        volDisplay.textContent = 'MUTED';
        volDisplay.classList.add('muted');
      } else {
        const pct = Math.round(video.volume * 100);
        volDisplay.textContent = `${pct}%`;
        volDisplay.classList.remove('muted');
      }
    }

    function setVolumeDelta(delta) {
      video.muted = false;
      const target = Math.min(1, Math.max(0, video.volume + delta));
      video.volume = Number(target.toFixed(2));
      updateVolumeDisplay();
      showOsdBriefly();
    }

    function toggleMute() {
      video.muted = !video.muted;
      updateVolumeDisplay();
      showOsdBriefly();
    }

    function updateActualResolutionBadge() {
      const h = video.videoHeight;
      if (h && h > 0) {
        let label = `${h}p`;
        if (h >= 2160) label = '4K';
        else if (h >= 1440) label = '1440p';
        else if (h >= 1080) label = '1080p';
        else if (h >= 720) label = '720p';
        else if (h >= 576) label = '576p';
        else if (h >= 480) label = '480p';

        npResBadge.textContent = label;
        npResBadge.classList.add('active');
        fsResBadge.textContent = label;
        fsResBadge.classList.add('active');
      } else {
        npResBadge.classList.remove('active');
        fsResBadge.classList.remove('active');
      }
    }

    video.addEventListener('resize', updateActualResolutionBadge);
    video.addEventListener('loadedmetadata', updateActualResolutionBadge);

        } else {

        }

    function adjustChannelRowSizes() {
      const containerHeight = channelListEl.clientHeight;
      const totalItems = channelListEl.querySelectorAll('.channel-item:not([style*="display: none"])').length;
      const totalDividers = channelListEl.querySelectorAll('.flag-divider:not([style*="display: none"])').length;

      if (totalItems > 0 && containerHeight > 0) {
        const dividerSpace = totalDividers * 15;
        const availableForItems = Math.max(containerHeight - dividerSpace - 4, 60);
        const calculatedRowH = Math.floor(availableForItems / totalItems);
        const clampedH = Math.min(Math.max(calculatedRowH, 18), 34);
        document.documentElement.style.setProperty('--row-h', `${clampedH}px`);
      }
    }

    function renderChannels(filterText = '') {
      channelListEl.innerHTML = '';
      const filter = filterText.toLowerCase();
      let totalMatched = 0;

      const countryGroups = {};
      CHANNELS.forEach((ch, idx) => {
        if (ch.isAvailable === false && ch.validated) return;
        if (!countryGroups[ch.country]) countryGroups[ch.country] = [];
        countryGroups[ch.country].push({ ...ch, originalIndex: idx });
      });

      Object.keys(countryGroups).forEach((countryKey) => {
        const meta = COUNTRY_META[countryKey] || { name: "", flagId: "" };
        const channels = countryGroups[countryKey];
        const matched = channels.filter(ch => 
          ch.name.toLowerCase().includes(filter) ||
          ch.group.toLowerCase().includes(filter) ||
          meta.name.toLowerCase().includes(filter)
        );

        if (matched.length > 0) {
          totalMatched += matched.length;

          if (meta.flagId) {
            const flagDiv = document.createElement('div');

            flagDiv.innerHTML = `<svg class="flag-icon"><use href="${meta.flagId}"/></svg>`;

              </div>
              <div class="ch-info">
                <div class="ch-name">${ch.name}</div>
                <div class="ch-tag">${ch.group.split(';')[0]}</div>
              </div>
            `;
            item.addEventListener('click', (e) => {
              e.stopPropagation();
              loadChannel(ch.originalIndex);
              sidebar.classList.remove('visible');
            });
            channelListEl.appendChild(item);
          });
        }
      });

      channelCount.textContent = `Channels (${totalMatched})`;
      adjustChannelRowSizes();
    }

    function loadChannel(index) {
      if (index < 0) index = CHANNELS.length - 1;
      if (index >= CHANNELS.length) index = 0;
      activeIndex = index;

      const ch = CHANNELS[index];
      const meta = COUNTRY_META[ch.country] || { name: "", flagId: "" };

      npTitle.textContent = ch.name;
      npCategoryText.textContent = `${meta.name ? meta.name + ' • ' : ''}${ch.group}`;
      if (meta.flagId) {
        npFlag.innerHTML = `<use href="${meta.flagId}"/>`;
        npFlag.style.display = 'inline-block';
      } else {
        npFlag.style.display = 'none';
      }
      npLogo.src = ch.logo;

      fsTitle.textContent = ch.name;
      fsCategory.textContent = `${meta.name ? meta.name + ' • ' : ''}${ch.group}`;
      if (meta.flagId) {
        fsFlag.innerHTML = `<use href="${meta.flagId}"/>`;
        fsFlag.style.display = 'inline-block';
      } else {
        fsFlag.style.display = 'none';
      }
      fsLogo.src = ch.logo;

      npResBadge.classList.remove('active');
      fsResBadge.classList.remove('active');

      updateActiveItemStyles();
      showOsdBriefly();

      if (video.canPlayType('application/vnd.apple.mpegurl') && isMobile) {
        if (currentHls) {
          currentHls.destroy();
          currentHls = null;
        }
        video.src = ch.url;
        video.play().catch(() => {});
      } else if (Hls.isSupported()) {
        if (currentHls) currentHls.destroy();
        currentHls = new Hls({ 
          enableWorker: true, 
          lowLatencyMode: true,
          capLevelToPlayerSize: true
        });

        currentHls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch(data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                currentHls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                currentHls.recoverMediaError();
                break;
              default:
                currentHls.destroy();
                browseChannel(1);
                break;
            }
          }
        });

        currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (currentHls.levels && currentHls.levels.length > 0) {
            let max1080pIndex = -1;
            for (let i = 0; i < currentHls.levels.length; i++) {
              if (currentHls.levels[i].height <= 1080) {
                max1080pIndex = i;
              }
            }
            if (max1080pIndex !== -1) {
              currentHls.currentLevel = max1080pIndex;
            }
          }
          video.play().catch(() => {});
        });

        currentHls.on(Hls.Events.LEVEL_SWITCHED, () => {
          setTimeout(updateActualResolutionBadge, 200);
        });

        currentHls.loadSource(ch.url);
        currentHls.attachMedia(video);
      }
    }

    function browseChannel(direction) {
      let nextIndex = activeIndex;
      for (let i = 0; i < CHANNELS.length; i++) {
        nextIndex = (nextIndex + direction + CHANNELS.length) % CHANNELS.length;
        const candidate = CHANNELS[nextIndex];
        if (!candidate.skipOnBrowse && (candidate.isAvailable || candidate.isAvailable === undefined)) {
          loadChannel(nextIndex);
          return;
        }
      }
      loadChannel(nextIndex);
    }

    async function validateAllStreams() {
      const probePromises = CHANNELS.map(async (ch) => {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000);
          const response = await fetch(ch.url, { 
            method: 'GET',
            mode: 'cors',
            cache: 'no-store',
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          ch.isAvailable = response.ok;
        } catch (err) {
          ch.isAvailable = false;
        } finally {
          ch.validated = true;
        }
      });

      await Promise.allSettled(probePromises);
      renderChannels(searchInput.value);

      if (CHANNELS[activeIndex] && CHANNELS[activeIndex].isAvailable === false) {
        browseChannel(1);
      }
    }

    function isFullscreen() {
      return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function toggleFullscreen() {
      video.muted = false;

      if (video.webkitEnterFullscreen && isMobile && !document.fullscreenEnabled) {
        video.webkitEnterFullscreen();
        return;
      }

      if (!isFullscreen()) {
        const target = playerContainer;
        if (target.requestFullscreen) target.requestFullscreen().catch(() => {});
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    function togglePlayPause() {
      if (video.paused) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
      showOsdBriefly();
    }

    function handleMouseMove(e) {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      playerContainer.classList.remove('hide-cursor');
      clearTimeout(cursorTimeout);
      cursorTimeout = setTimeout(() => {
        if (!sidebar.classList.contains('visible')) {
          playerContainer.classList.add('hide-cursor');
        }
      }, 2500);

      const isWithinRight30Percent = e.clientX >= (windowWidth * 0.70);
      if (isWithinRight30Percent || sidebar.matches(':hover')) {
        showSidebar();
      } else {
        hideSidebar();
      }

      if (isFullscreen()) {
        const isNearBottom = e.clientY >= (windowHeight - 70);
        if (isNearBottom || nowPlayingBar.matches(':hover')) {
          nowPlayingBar.classList.add('reveal-bar');
        } else {
          nowPlayingBar.classList.remove('reveal-bar');
        }
      }

      showOsdBriefly();
    }

    function showSidebar() {
      clearTimeout(sidebarHideTimeout);
      sidebar.classList.add('visible');
    }

    function hideSidebar() {
      sidebarHideTimeout = setTimeout(() => {
        sidebar.classList.remove('visible');
      }, 200);
    }

    function showOsdBriefly() {
      if (!isFullscreen()) return;
      fsOsd.classList.add('visible');
      clearTimeout(osdTimeout);
      osdTimeout = setTimeout(() => {
        if (!sidebar.classList.contains('visible')) {
          fsOsd.classList.remove('visible');
        }
      }, 2500);
    }

    function jumpToFirstCountry(countryCode) {
      const idx = CHANNELS.findIndex(ch => ch.country === countryCode && ch.isAvailable !== false);
      if (idx !== -1) loadChannel(idx);
    }

    viewport.addEventListener('click', (e) => {
      if (e.target.closest('#fullscreen-gate') || e.target.closest('#sidebar') || e.target.closest('.fs-top-hud') || e.target.closest('#nowPlayingBar')) {
        return;
      }
      if (isFullscreen()) {
        if (sidebar.classList.contains('visible')) {
          sidebar.classList.remove('visible');
          return;
        }
        if (fsOsd.classList.contains('visible')) {
          fsOsd.classList.remove('visible');
        } else {
          showOsdBriefly();
        }
      }
    });

    window.addEventListener('mousemove', handleMouseMove);
    sidebar.addEventListener('mouseenter', showSidebar);
    sidebar.addEventListener('mouseleave', hideSidebar);

    document.addEventListener('fullscreenchange', () => {
      if (!isFullscreen()) {
        nowPlayingBar.classList.remove('reveal-bar');
        playerContainer.classList.remove('hide-cursor');
        fsOsd.classList.remove('visible');
      }
      setTimeout(adjustChannelRowSizes, 100);
    });

    window.addEventListener('resize', adjustChannelRowSizes);

    window.addEventListener('keydown', (e) => {
      const isInputActive = (document.activeElement === searchInput);

      if (e.key === 'Escape') {
        if (isInputActive) {
          searchInput.blur();
          return;
        }
        if (sidebar.classList.contains('visible')) {
          sidebar.classList.remove('visible');
          return;
        }
        if (isFullscreen()) {
          toggleFullscreen();
          return;
        }
      }

      if (isInputActive) {
        if (e.key === 'Enter') {
          const firstItem = document.querySelector('.channel-item');
          if (firstItem) {
            const idx = parseInt(firstItem.getAttribute('data-index'), 10);
            loadChannel(idx);
            searchInput.blur();
          }
        }
        return;
      }

      // Enter: Start stream / Toggle Fullscreen / Dismiss interaction gate
      if (e.key === 'Enter') {
        e.preventDefault();
        if (gate.style.display !== 'none') {
          gate.click();
        } else {
          toggleFullscreen();
        }
        return;
      }

      // Space: Dedicated Play / Pause
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
        return;
      }

      // M: Dedicated Mute / Unmute
      if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        toggleMute();
        return;
      }

      // Navigation shortcuts
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        browseChannel(-1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        browseChannel(1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setVolumeDelta(0.05);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        setVolumeDelta(-0.05);
      } else if (e.key === 'e' || e.key === 'E') {
        e.preventDefault();
        jumpToFirstCountry('EN');
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        jumpToFirstCountry('FR');
      } else if (e.key === 's' || e.key === 'S') {
        e.preventDefault();
        jumpToFirstCountry('ES');
      } else if (e.key === 'd' || e.key === 'D' || e.key === 'g' || e.key === 'G') {
        e.preventDefault();
        jumpToFirstCountry('DE');
      } else if (e.key === 'l' || e.key === 'L') {
        e.preventDefault();
        jumpToFirstCountry('LU');
      } else if (e.code === 'KeyI' || e.key === 'i' || e.key === 'I' || e.key === 'İ' || e.key === 'ı') {
        e.preventDefault();
        jumpToFirstCountry('IT');
      } else if (e.key === 't' || e.key === 'T') {
        e.preventDefault();
        jumpToFirstCountry('TR');
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        sidebar.classList.toggle('visible');
      }
    });

    gate.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreen();
      gate.style.opacity = '0';
      setTimeout(() => { gate.style.display = 'none'; }, 250);
    });

    fsToggleBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });
    playPauseBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlayPause(); });
    prevChBtn.addEventListener('click', (e) => { e.stopPropagation(); browseChannel(-1); });
    nextChBtn.addEventListener('click', (e) => { e.stopPropagation(); browseChannel(1); });
    volDownBtn.addEventListener('click', (e) => { e.stopPropagation(); setVolumeDelta(-0.05); });
    volUpBtn.addEventListener('click', (e) => { e.stopPropagation(); setVolumeDelta(0.05); });
    volDisplay.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });
    fsOpenDrawerBtn.addEventListener('click', (e) => { e.stopPropagation(); sidebar.classList.toggle('visible'); });
    fsExitBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });

    sidebar.addEventListener('click', (e) => e.stopPropagation());
    searchInput.addEventListener('input', (e) => renderChannels(e.target.value));

    renderChannels();
    loadChannel(0);
    updateVolumeDisplay();
    validateAllStreams();
    setTimeout(adjustChannelRowSizes, 150);
  </script>
</body>
</html>
