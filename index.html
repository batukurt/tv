<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live TV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-base: #0f1117;
      --bg-surface: #1a1d26;
      --bg-card: #232733;
      --bg-card-hover: #2e3344;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2d3343;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top navigation / header */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .search-box {
      position: relative;
      width: 280px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-base);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    /* Main layout */
    .container {
      display: grid;
      grid-template-columns: 1fr 380px;
      flex: 1;
      height: calc(100vh - 61px);
    }

    @media (max-width: 992px) {
      .container {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    /* Player column */
    .player-section {
      display: flex;
      flex-direction: column;
      background-color: #000;
      position: relative;
    }

    .video-viewport {
      flex: 1;
      position: relative;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 340px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Fullscreen Overlay Gate */
    #fullscreen-gate {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: opacity 0.25s ease;
    }

    #fullscreen-gate .btn {
      padding: 14px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 9999px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .now-playing-bar {
      padding: 14px 20px;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .np-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .np-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
      background: #fff;
      border-radius: 6px;
      padding: 4px;
    }

    .np-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .np-category {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .player-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background-color 0.15s;
    }

    .action-btn:hover {
      background-color: var(--bg-card-hover);
    }

    /* Sidebar / Channel List */
    .sidebar {
      background-color: var(--bg-surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 8px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      border: 1px solid transparent;
    }

    .channel-item:hover {
      background-color: var(--bg-card);
    }

    .channel-item.active {
      background-color: var(--bg-card);
      border-color: var(--accent);
    }

    .ch-logo-wrap {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      padding: 3px;
    }

    .ch-logo-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .ch-info {
      flex: 1;
      min-width: 0;
    }

    .ch-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ch-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .active-badge {
      display: none;
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
    }

    .channel-item.active .active-badge {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="live-dot"></div>
      Live Channels
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search channels...">
    </div>
  </header>

  <div class="container">
    <!-- Video Player Section -->
    <section class="player-section">
      <div class="video-viewport" id="viewport">
        <video id="videoPlayer" controls autoplay muted playsinline></video>
        
        <!-- One-click fullscreen & sound trigger -->
        <div id="fullscreen-gate">
          <div class="btn">Click for Fullscreen & Sound</div>
        </div>
      </div>

      <div class="now-playing-bar">
        <div class="np-info">
          <img id="npLogo" class="np-logo" src="" alt="Channel Logo">
          <div>
            <div id="npTitle" class="np-title">Select a channel</div>
            <div id="npCategory" class="np-category">-</div>
          </div>
        </div>
        <div class="player-actions">
          <button class="action-btn" id="fsToggleBtn">Fullscreen</button>
        </div>
      </div>
    </section>

    <!-- Channel List Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header" id="channelCount">Channels</div>
      <ul class="channel-list" id="channelList"></ul>
    </aside>
  </div>

      },

        name: "ZDF",
        group: "General",
        logo: "https://i.imgur.com/rtLb6m9.png",
        url: "https://dash4.antik.sk/live/test_zdf_avc_25p/playlist.m3u8"
      },
      {
        id: "RTLTeleLetzebuerg.lu@SD",
        name: "RTL Tele Letzebuerg (1080p)",
        group: "General",
        logo: "https://i.imgur.com/fkW5Gbl.png",
        url: "https://live-edge.rtl.lu/channel1/smil:channel1/playlist.m3u8"
      }

    const video = document.getElementById('videoPlayer');
    const viewport = document.getElementById('viewport');
    const gate = document.getElementById('fullscreen-gate');
    const channelListEl = document.getElementById('channelList');
    const searchInput = document.getElementById('searchInput');
    const fsToggleBtn = document.getElementById('fsToggleBtn');
    const npTitle = document.getElementById('npTitle');
    const npCategory = document.getElementById('npCategory');
    const npLogo = document.getElementById('npLogo');
    const channelCount = document.getElementById('channelCount');

    let currentHls = null;
    let activeChannelIndex = 0;

    function renderChannels(filterText = '') {
      channelListEl.innerHTML = '';
      const filtered = CHANNELS.filter(ch => 
        ch.name.toLowerCase().includes(filterText.toLowerCase()) || 
        ch.group.toLowerCase().includes(filterText.toLowerCase())
      );

      channelCount.textContent = `Channels (${filtered.length})`;

      filtered.forEach((ch) => {
        const originalIndex = CHANNELS.indexOf(ch);
        const li = document.createElement('li');
        li.className = `channel-item ${originalIndex === activeChannelIndex ? 'active' : ''}`;
        li.innerHTML = `
          <div class="ch-logo-wrap">
            <img src="${ch.logo}" alt="${ch.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 24 24\\'%3E%3Cpath fill=\\'%23888\\' d=\\'M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z\\'/%3E%3C/svg%3E'">
          </div>
          <div class="ch-info">
            <div class="ch-name">${ch.name}</div>
            <div class="ch-tag">${ch.group}</div>
          </div>
          <div class="active-badge"></div>
        `;
        li.addEventListener('click', () => loadChannel(originalIndex));
        channelListEl.appendChild(li);
      });
    }

    function loadChannel(index) {
      activeChannelIndex = index;
      const ch = CHANNELS[index];

      npTitle.textContent = ch.name;
      npCategory.textContent = ch.group;
      npLogo.src = ch.logo;
      npLogo.style.display = 'block';

      // Update active selection classes
      renderChannels(searchInput.value);

      if (Hls.isSupported()) {
        if (currentHls) currentHls.destroy();
        currentHls = new Hls({ enableWorker: true, lowLatencyMode: true });
        currentHls.loadSource(ch.url);
        currentHls.attachMedia(video);
        currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = ch.url;
        video.play().catch(() => {});
      }
    }

    function toggleFullscreen(targetElement = viewport) {
      video.muted = false;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (targetElement.requestFullscreen) {
          targetElement.requestFullscreen().catch(err => console.log(err));
        } else if (targetElement.webkitRequestFullscreen) {
          targetElement.webkitRequestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    // Fullscreen gate interaction
    gate.addEventListener('click', () => {
      toggleFullscreen(viewport);
      gate.style.opacity = '0';
      setTimeout(() => { gate.style.display = 'none'; }, 250);
    });

    fsToggleBtn.addEventListener('click', () => toggleFullscreen(viewport));

    searchInput.addEventListener('input', (e) => {
      renderChannels(e.target.value);
    });

    // Initial boot: start with Bloomberg TV+ or first item
    const defaultIndex = CHANNELS.findIndex(c => c.id === 'BloombergTV.us@Plus');
    loadChannel(defaultIndex !== -1 ? defaultIndex : 0);
