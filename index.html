<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0d13">
  <title>AFL TV</title>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: rgba(18, 22, 34, 0.94);
      --bg-card: rgba(255, 255, 255, 0.1);
      --bg-card-hover: rgba(255, 255, 255, 0.22);
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.5);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.14);
      --row-h: 36px;
      --sidebar-w: 360px;
      --btn-h: 46px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    #app.hide-cursor {
      cursor: none;
    }

    /* Video Player Viewport */
    .video-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
    }

    .video-ratio-box {
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (16 / 9));
      max-height: calc(100vw * (9 / 16));
      aspect-ratio: 16 / 9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Fullscreen Initial Tap Gate */
    #fullscreen-gate {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.25s ease;
    }

    #fullscreen-gate .gate-btn {
      padding: 18px 36px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: rgba(37, 99, 235, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 9999px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
      text-align: center;
    }

    /* =========================================================
       TOP CONSOLIDATED OVERLAY BAR
       ========================================================= */
    .unified-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--bg-surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      opacity: 0;
      transform: translateY(-100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease, padding-right 0.28s ease;
      pointer-events: none;
    }

    .unified-top-bar.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Shrink the right side of the top bar to yield space to the opened channel list */
    .unified-top-bar.drawer-open {
      padding-right: calc(var(--sidebar-w) + 12px);
    }

    .brand-signal {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 10px #ef4444;
      animation: pulse 1.8s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    .np-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .np-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      background: #fff;
      border-radius: 5px;
      padding: 1px;
      flex-shrink: 0;
    }

    .np-text {
      min-width: 0;
    }

    .np-title {
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .np-category {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .res-badge {
      display: none;
      background: rgba(37, 99, 235, 0.3);
      border: 1px solid rgba(37, 99, 235, 0.8);
      color: #93c5fd;
      font-size: 0.64rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      line-height: 1;
    }

    .res-badge.active {
      display: inline-block;
    }

    /* Controls dynamically share all remaining width */
    .top-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 0%;
      min-width: 0;
    }

    .action-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      height: var(--btn-h);
      padding: 0 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1;
      white-space: nowrap;
      flex: 1 1 0%; /* Dynamically share width equally */
      min-width: 0;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .action-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .action-btn.btn-accent {
      background: rgba(37, 99, 235, 0.38);
      border-color: rgba(37, 99, 235, 0.85);
      color: #bfdbfe;
    }

    kbd {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #cbd5e1;
      padding: 2px 4px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 600;
      pointer-events: none;
    }

    .vol-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      height: var(--btn-h);
      flex: 1.2 1 0%;
      min-width: 0;
    }

    .vol-btn {
      flex: 1 1 0% !important;
      height: 32px !important;
      min-height: 32px !important;
      padding: 0 4px !important;
      font-size: 0.75rem !important;
    }

    .vol-indicator {
      font-size: 0.82rem;
      font-weight: 800;
      color: #cbd5e1;
      padding: 0 4px;
      min-width: 44px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .vol-indicator.muted {
      color: #f87171;
    }

    /* =========================================================
       TWO-COLUMN FULL-HEIGHT CHANNEL DRAWER
       ========================================================= */
    .sidebar {
      position: absolute;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      height: 100% !important;
      width: var(--sidebar-w);
      background: rgba(13, 17, 26, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 40;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    .sidebar.visible {
      transform: translateX(0);
      pointer-events: auto;
    }

    .sidebar-header {
      height: 48px;
      padding: 0 16px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .close-drawer-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.35rem;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      line-height: 1;
    }

    .close-drawer-btn:active {
      color: #fff;
    }

    .channel-list {
      flex: 1 1 0%;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: var(--row-h);
      overflow-y: hidden;
      padding: 6px 8px;
      gap: 4px 6px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s ease;
      border: 1px solid transparent;
      height: var(--row-h);
      min-height: 24px;
      line-height: 1;
      background: rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .channel-item:hover {
      background-color: var(--bg-card-hover);
    }

    .channel-item.active {
      background-color: rgba(37, 99, 235, 0.35);
      border-color: var(--accent);
      box-shadow: inset 4px 0 0 var(--accent);
    }

    .ch-logo-wrap {
      height: 72%;
      max-height: 26px;
      aspect-ratio: 4 / 3;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      padding: 1px;
      pointer-events: none;
    }

    .ch-logo-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .ch-name {
      flex: 1;
      min-width: 0;
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .toast-msg {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s ease;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
    }

    .toast-msg.show {
      opacity: 1;
    }

    /* Mobile Adaptations */
    @media (max-width: 768px) {
      :root {
        --sidebar-w: min(92vw, 360px);
        --btn-h: 40px;
      }

      .unified-top-bar {
        padding: 6px 8px;
        gap: 6px;
      }

      .unified-top-bar.drawer-open {
        padding-right: 8px; /* On phones, channel list covers full width */
      }

      .np-title {
        max-width: 100px;
        font-size: 0.75rem;
      }

      .action-btn {
        padding: 0 4px;
        font-size: 0.65rem;
        gap: 3px;
      }

      .vol-group {
        padding: 2px 4px;
      }

      .vol-btn {
        height: 28px !important;
        min-height: 28px !important;
        padding: 0 2px !important;
      }

      .vol-indicator {
        min-width: 34px;
        font-size: 0.70rem;
      }

      .channel-list {
        padding: 4px;
        gap: 3px 4px;
      }

      .channel-item {
        padding: 0 6px;
      }

      .ch-name {
        font-size: 0.70rem;
      }
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="video-viewport" id="viewport">
      <div class="video-ratio-box">
        <video id="videoPlayer" autoplay muted playsinline webkit-playsinline></video>
      </div>

      <!-- Fullscreen startup gate -->
      <div id="fullscreen-gate">
        <div class="gate-btn">Tap or Press [Enter] to Start</div>
      </div>

      <div id="toastMessage" class="toast-msg"></div>

      <!-- Top Overlay Controls Bar (Dynamically shared width) -->
      <header class="unified-top-bar" id="unifiedTopBar">
        <div class="brand-signal">
          <div class="live-dot" title="AFL TV Live Stream"></div>
          <div class="np-info">
            <img id="npLogo" class="np-logo" src="" alt="Channel Logo">
            <div class="np-text">
              <div id="npTitle" class="np-title">Select channel</div>
              <div id="npCategory" class="np-category">
                <span id="npCategoryText">-</span>
                <span id="npResBadge" class="res-badge">...</span>
              </div>
            </div>
          </div>
        </div>

        <div class="top-controls">
          <button class="action-btn" id="prevChBtn" title="Previous Channel [◀]">◀ Prev <kbd>◀</kbd></button>
          <button class="action-btn btn-accent" id="playPauseBtn" title="Play / Pause [Space]">⏯ Play <kbd>Space</kbd></button>
          <button class="action-btn" id="nextChBtn" title="Next Channel [▶]">Next ▶ <kbd>▶</kbd></button>

          <div class="vol-group">
            <button class="action-btn vol-btn" id="volDownBtn" title="Volume Down [▼]">🔉</button>
            <div class="vol-indicator" id="volDisplay" title="Mute/Unmute [M]"><span id="volPercent">100%</span> <kbd>M</kbd></div>
            <button class="action-btn vol-btn" id="volUpBtn" title="Volume Up [▲]">🔊</button>
          </div>

          <button class="action-btn" id="ccBtn" title="Subtitles [-]">💬 CC <kbd>-</kbd></button>
          <button class="action-btn" id="pipBtn" title="Picture in Picture [P]">⧉ PiP <kbd>P</kbd></button>
          <button class="action-btn" id="fsToggleBtn" title="Toggle Fullscreen [Enter / F11]">⛶ Full <kbd>Enter</kbd></button>
          <button class="action-btn btn-accent" id="channelsBtn" title="Channels Drawer [C]">☰ Channels <kbd>C</kbd></button>
        </div>
      </header>

      <!-- 2-Column Channel Drawer covering entire viewport height -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span id="channelCount">Channels</span>
          <button class="close-drawer-btn" id="closeDrawerBtn" title="Close [Esc]">✕</button>
        </div>
        <div class="channel-list" id="channelList"></div>
      </aside>
    </div>
  </div>

    function showToast(msg) {
      toastMessage.textContent = msg;
      toastMessage.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastMessage.classList.remove('show');
      }, 1500);
    }

    /* Unified Touch / Mouse Activity Engine */
    function showControlsAndDrawer() {
      unifiedTopBar.classList.add('visible');
      sidebar.classList.add('visible');
      unifiedTopBar.classList.add('drawer-open');
      appContainer.classList.remove('hide-cursor');
      clearTimeout(uiTimeout);
      uiTimeout = setTimeout(() => {
        if (!video.paused) {
          hideControlsAndDrawer();
        }
      }, 3500);
    }

    function hideControlsAndDrawer() {
      unifiedTopBar.classList.remove('visible');
      unifiedTopBar.classList.remove('drawer-open');
      sidebar.classList.remove('visible');
      if (isFullscreen()) {
        appContainer.classList.add('hide-cursor');
      }
    }

    function toggleControlsAndDrawer() {
      if (sidebar.classList.contains('visible') || unifiedTopBar.classList.contains('visible')) {
        hideControlsAndDrawer();
      } else {
        showControlsAndDrawer();
      }
    }

    function updateVolumeDisplay() {
      if (video.muted) {
        volPercent.textContent = 'MUTED';
        volDisplay.classList.add('muted');
      } else {
        const pct = Math.round(video.volume * 100);
        volPercent.textContent = `${pct}%`;
        volDisplay.classList.remove('muted');
      }
    }

    function setVolumeDelta(delta) {
      video.muted = false;
      const target = Math.min(1, Math.max(0, video.volume + delta));
      video.volume = Number(target.toFixed(2));
      updateVolumeDisplay();
      showToast(`Volume: ${Math.round(video.volume * 100)}%`);
      showControlsAndDrawer();
    }

    function toggleMute() {
      video.muted = !video.muted;
      updateVolumeDisplay();
      showToast(video.muted ? 'Muted' : `Volume: ${Math.round(video.volume * 100)}%`);
      showControlsAndDrawer();
    }

    function toggleCaptions() {
      if (currentHls && currentHls.subtitleTracks && currentHls.subtitleTracks.length > 0) {
        const nextTrack = (currentHls.subtitleTrack + 2) % (currentHls.subtitleTracks.length + 1) - 1;
        currentHls.subtitleTrack = nextTrack;
        const trackName = nextTrack === -1 ? 'Off' : (currentHls.subtitleTracks[nextTrack].name || `Track ${nextTrack + 1}`);
        showToast(`Subtitles: ${trackName}`);
      } else if (video.textTracks && video.textTracks.length > 0) {
        let activeIdx = -1;
        for (let i = 0; i < video.textTracks.length; i++) {
          if (video.textTracks[i].mode === 'showing') {
            activeIdx = i;
            video.textTracks[i].mode = 'disabled';
          }
        }
        const nextIdx = activeIdx + 1;
        if (nextIdx < video.textTracks.length) {
          video.textTracks[nextIdx].mode = 'showing';
          showToast(`Subtitles: ${video.textTracks[nextIdx].label || `Track ${nextIdx + 1}`}`);
        } else {
          showToast('Subtitles: Off');
        }
      } else {
        showToast('Subtitles: Not available');
      }
      showControlsAndDrawer();
    }

    async function togglePictureInPicture() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled && video !== document.pictureInPictureElement) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        console.warn("PiP error:", err);
      }
      showControlsAndDrawer();
    }

    function updateActualResolutionBadge() {
      const h = video.videoHeight;
      if (h && h > 0) {
        let label = `${h}p`;
        if (h >= 2160) label = '4K';
        else if (h >= 1440) label = '1440p';
        else if (h >= 1080) label = '1080p';
        else if (h >= 720) label = '720p';
        else if (h >= 576) label = '576p';
        else if (h >= 480) label = '480p';

        npResBadge.textContent = label;
        npResBadge.classList.add('active');
      } else {
        npResBadge.classList.remove('active');
      }
    }

    video.addEventListener('resize', updateActualResolutionBadge);
    video.addEventListener('loadedmetadata', updateActualResolutionBadge);
    video.addEventListener('volumechange', updateVolumeDisplay);

    function updateActiveItemStyles() {
      document.querySelectorAll('.channel-item').forEach(el => {
        const itemIdx = parseInt(el.getAttribute('data-index'), 10);
        if (itemIdx === activeIndex) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
    }

    function adjustChannelRowSizes() {
      const containerHeight = channelListEl.clientHeight;
      const totalItems = channelListEl.querySelectorAll('.channel-item').length;
      if (totalItems > 0 && containerHeight > 0) {
        const rowCount = Math.ceil(totalItems / 2);
        const calculatedRowH = Math.floor((containerHeight - (rowCount * 3)) / rowCount);
        const clampedH = Math.min(Math.max(calculatedRowH, 11), 36);
        document.documentElement.style.setProperty('--row-h', `${clampedH}px`);
      }
    }

    function renderChannels() {
      channelListEl.innerHTML = '';
      let totalMatched = 0;

      const countryGroups = {};
      CHANNELS.forEach((ch, idx) => {
        if (ch.isAvailable === false && ch.validated) return;
        if (!countryGroups[ch.country]) countryGroups[ch.country] = [];
        countryGroups[ch.country].push({ ...ch, originalIndex: idx });
      });

      Object.keys(countryGroups).forEach((countryKey) => {
        let channels = countryGroups[countryKey];

        if (countryKey !== 'TR' && countryKey !== 'SPECIAL') {
          channels.sort((a, b) => {
            if (a.pinnedTop) return -1;
            if (b.pinnedTop) return 1;
            return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
          });
        }

        if (channels.length > 0) {
          totalMatched += channels.length;

          channels.forEach(ch => {
            const item = document.createElement('div');
            item.className = `channel-item ${ch.originalIndex === activeIndex ? 'active' : ''}`;
            item.setAttribute('data-index', ch.originalIndex);
            item.title = ch.name;
            item.innerHTML = `
              <div class="ch-logo-wrap">
                <img src="${ch.logo}" alt="${ch.name}" loading="lazy">
              </div>
              <div class="ch-name">${ch.name}</div>
            `;
            item.addEventListener('click', (e) => {
              e.stopPropagation();
              loadChannel(ch.originalIndex);
              hideControlsAndDrawer();
            });
            channelListEl.appendChild(item);
          });
        }
      });

      channelCount.textContent = `Channels (${totalMatched})`;
      adjustChannelRowSizes();
    }

    function failoverToNextStream(ch) {
      if (ch.urls && ch.urls.length > 1) {
        const currIdx = ch.urls.indexOf(ch.url);
        const nextUrl = ch.urls[(currIdx + 1) % ch.urls.length];
        if (nextUrl !== ch.url) {
          ch.url = nextUrl;
          if (currentHls) {
            currentHls.loadSource(ch.url);
          } else {
            video.src = ch.url;
            video.play().catch(() => {});
          }
          return true;
        }
      }
      return false;
    }

    function loadChannel(index) {
      if (index < 0) index = CHANNELS.length - 1;
      if (index >= CHANNELS.length) index = 0;
      activeIndex = index;

      const ch = CHANNELS[index];

      npTitle.textContent = ch.name;
      npCategoryText.textContent = ch.group;
      npLogo.src = ch.logo;
      npResBadge.classList.remove('active');

      updateActiveItemStyles();

      if (Hls.isSupported()) {
        if (currentHls) currentHls.destroy();
        currentHls = new Hls({ 
          enableWorker: true, 
          lowLatencyMode: true,
          capLevelToPlayerSize: true,
          backBufferLength: 90
        });

        currentHls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch(data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                if (!failoverToNextStream(ch)) currentHls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                currentHls.recoverMediaError();
                break;
              default:
                if (!failoverToNextStream(ch)) {
                  currentHls.destroy();
                  browseChannel(1);
                }
                break;
            }
          }
        });

        currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (currentHls.levels && currentHls.levels.length > 0) {
            let max1080pIndex = -1;
            for (let i = 0; i < currentHls.levels.length; i++) {
              if (currentHls.levels[i].height <= 1080) {
                max1080pIndex = i;
              }
            }
            if (max1080pIndex !== -1) {
              currentHls.currentLevel = max1080pIndex;
            }
          }
          video.play().catch(() => {});
        });

        currentHls.on(Hls.Events.LEVEL_SWITCHED, () => {
          setTimeout(updateActualResolutionBadge, 200);
        });

        currentHls.loadSource(ch.url);
        currentHls.attachMedia(video);

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        if (currentHls) {
          currentHls.destroy();
          currentHls = null;
        }
        video.src = ch.url;
        video.play().catch(() => {});
      }
    }

    function browseChannel(direction) {
      let nextIndex = activeIndex;
      for (let i = 0; i < CHANNELS.length; i++) {
        nextIndex = (nextIndex + direction + CHANNELS.length) % CHANNELS.length;
        const candidate = CHANNELS[nextIndex];
        if (!candidate.skipOnBrowse && (candidate.isAvailable || candidate.isAvailable === undefined)) {
          loadChannel(nextIndex);
          showControlsAndDrawer();
          return;
        }
      }
      loadChannel(nextIndex);
      showControlsAndDrawer();
    }

    function cycleCountryCategory(countryCode) {
      const countryIndices = [];
      CHANNELS.forEach((ch, idx) => {
        if (ch.country === countryCode && ch.isAvailable !== false) {
          countryIndices.push(idx);
        }
      });

      if (countryIndices.length === 0) return;

      const currentPos = countryIndices.indexOf(activeIndex);
      if (currentPos !== -1) {
        const nextPos = (currentPos + 1) % countryIndices.length;
        loadChannel(countryIndices[nextPos]);
      } else {
        loadChannel(countryIndices[0]);
      }
      showControlsAndDrawer();
    }

    function extractMaxHeightFromPlaylist(text) {
      const matches = [...text.matchAll(/RESOLUTION=\d+x(\d+)/gi)];
      if (matches.length > 0) {
        return Math.max(...matches.map(m => parseInt(m[1], 10)));
      }
      return 720;
    }

    async function probeStreamQuality(url) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);
        const res = await fetch(url, { method: 'GET', mode: 'cors', cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) return { ok: false, height: 0, url };
        const text = await res.text();
        return { ok: true, height: extractMaxHeightFromPlaylist(text), url };
      } catch (err) {
        return { ok: false, height: 0, url };
      }
    }

    async function validateAllStreams() {
      const probePromises = CHANNELS.map(async (ch) => {
        if (ch.urls && ch.urls.length > 0) {
          const results = await Promise.all(ch.urls.map(u => probeStreamQuality(u)));
          const working = results.filter(r => r.ok).sort((a, b) => b.height - a.height);
          if (working.length > 0) {
            ch.url = working[0].url;
            ch.isAvailable = true;
          } else {
            ch.isAvailable = false;
          }
        } else {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3500);
            const response = await fetch(ch.url, { method: 'GET', mode: 'cors', cache: 'no-store', signal: controller.signal });
            clearTimeout(timeoutId);
            ch.isAvailable = response.ok;
          } catch (err) {
            ch.isAvailable = false;
          }
        }
        ch.validated = true;
      });

      await Promise.allSettled(probePromises);
      renderChannels();

      if (CHANNELS[activeIndex] && CHANNELS[activeIndex].isAvailable === false) {
        browseChannel(1);
      } else if (activeIndex === 0) {
        loadChannel(0);
      }
    }

    function isFullscreen() {
      return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function toggleFullscreen() {
      video.muted = false;

      if (!isFullscreen()) {
        const target = appContainer;
        const req = target.requestFullscreen || target.webkitRequestFullscreen;
        if (req) {
          req.call(target).then(() => {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(() => {});
            }
          }).catch(() => {});
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      } else {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
      showControlsAndDrawer();
    }

    function togglePlayPause() {
      if (video.paused) {
        video.play().catch(() => {});
        playPauseBtn.innerHTML = '⏸ Pause <kbd>Space</kbd>';
      } else {
        video.pause();
        playPauseBtn.innerHTML = '⏯ Play <kbd>Space</kbd>';
      }
      showControlsAndDrawer();
    }

    /* Single Tap / Click Handlers */
    viewport.addEventListener('click', (e) => {
      if (e.target.closest('#fullscreen-gate') || e.target.closest('.action-btn') || e.target.closest('.sidebar')) {
        return;
      }
      toggleControlsAndDrawer();
    });

    window.addEventListener('mousemove', showControlsAndDrawer);
    window.addEventListener('touchstart', showControlsAndDrawer, { passive: true });

    document.addEventListener('fullscreenchange', () => {
      showControlsAndDrawer();
      setTimeout(adjustChannelRowSizes, 100);
    });

    window.addEventListener('resize', adjustChannelRowSizes);
    window.addEventListener('orientationchange', () => {
      setTimeout(adjustChannelRowSizes, 150);
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (sidebar.classList.contains('visible')) {
          hideControlsAndDrawer();
          return;
        }
        if (isFullscreen()) {
          toggleFullscreen();
          return;
        }
      }

      if (e.key === 'F11' || e.key === 'Enter') {
        e.preventDefault();
        if (gate.style.display !== 'none') {
          gate.click();
        } else {
          toggleFullscreen();
        }
        return;
      }

      if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        toggleCaptions();
        return;
      }

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
        return;
      }

      if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePictureInPicture();
        return;
      }

      if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        toggleMute();
        return;
      }

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        browseChannel(-1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        browseChannel(1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setVolumeDelta(0.05);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        setVolumeDelta(-0.05);
      } else if (e.key === 'e' || e.key === 'E') {
        e.preventDefault();
        cycleCountryCategory('EN');
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        cycleCountryCategory('FR');
      } else if (e.key === 's' || e.key === 'S') {
        e.preventDefault();
        cycleCountryCategory('ES');
      } else if (e.key === 'd' || e.key === 'D' || e.key === 'g' || e.key === 'G') {
        e.preventDefault();
        cycleCountryCategory('DE');
      } else if (e.key === 'l' || e.key === 'L') {
        e.preventDefault();
        cycleCountryCategory('LU');
      } else if (e.code === 'KeyI' || e.key === 'i' || e.key === 'I' || e.key === 'İ' || e.key === 'ı') {
        e.preventDefault();
        cycleCountryCategory('IT');
      } else if (e.key === 't' || e.key === 'T') {
        e.preventDefault();
        cycleCountryCategory('TR');
      } else if (e.key === 'z' || e.key === 'Z') {
        e.preventDefault();
        cycleCountryCategory('SPECIAL');
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        toggleControlsAndDrawer();
      }
    });

    // Touch & Button Click Handlers
    gate.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreen();
      gate.style.opacity = '0';
      setTimeout(() => { gate.style.display = 'none'; }, 250);
    });

    fsToggleBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });
    pipBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePictureInPicture(); });
    ccBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleCaptions(); });
    channelsBtn.addEventListener('click', (e) => { 
      e.stopPropagation(); 
      toggleControlsAndDrawer();
    });
    closeDrawerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      hideControlsAndDrawer();
    });

    playPauseBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlayPause(); });
    prevChBtn.addEventListener('click', (e) => { e.stopPropagation(); browseChannel(-1); });
    nextChBtn.addEventListener('click', (e) => { e.stopPropagation(); browseChannel(1); });
    volDownBtn.addEventListener('click', (e) => { e.stopPropagation(); setVolumeDelta(-0.05); });
    volUpBtn.addEventListener('click', (e) => { e.stopPropagation(); setVolumeDelta(0.05); });
    volDisplay.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });

    // Initial Bootstrap
    renderChannels();
    loadChannel(0);
    updateVolumeDisplay();
    validateAllStreams();
    showControlsAndDrawer();
    setTimeout(adjustChannelRowSizes, 150);
  </script>
</body>
</html>
