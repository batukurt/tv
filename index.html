<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0d13">
  <title>AFL TV</title>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-base: #0b0d13;
      --bg-surface: #141721;
      --bg-card: #1c2130;
      --bg-card-hover: #262c40;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.45);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #23293b;
      --bar-h: 46px;
      --row-h: 22px;
      --sidebar-w: 220px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background-color: var(--bg-base);
      position: relative;
    }

    /* Single Unified Top Header */
    .unified-top-bar {
      height: var(--bar-h);
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      z-index: 95;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    /* Desktop Fullscreen Auto-hide */
    @media (min-width: 900px) {
      #app:fullscreen .unified-top-bar,
      #app:-webkit-full-screen .unified-top-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        background: rgba(20, 23, 33, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transform: translateY(-100%);
        opacity: 0;
      }

      #app:fullscreen .unified-top-bar.reveal-top,
      #app:-webkit-full-screen .unified-top-bar.reveal-top {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .brand-signal {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse 1.8s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .np-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .np-logo {
      width: 26px;
      height: 26px;
      object-fit: contain;
      background: #fff;
      border-radius: 4px;
      padding: 1px;
      flex-shrink: 0;
    }

    .np-text {
      min-width: 0;
    }

    .np-title {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    .np-category {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .res-badge {
      display: none;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(37, 99, 235, 0.6);
      color: #93c5fd;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      padding: 1px 4px;
      border-radius: 3px;
      line-height: 1;
    }

    .res-badge.active {
      display: inline-block;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .vol-group {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 4px;
      border-radius: 5px;
      border: 1px solid var(--border);
    }

    .vol-indicator {
      font-size: 0.72rem;
      font-weight: 600;
      color: #cbd5e1;
      padding: 0 4px;
      min-width: 36px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .vol-indicator.muted {
      color: #f87171;
    }

    .action-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0 8px;
      height: 28px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      line-height: 1;
      white-space: nowrap;
    }

    .action-btn.btn-sm {
      padding: 0 4px;
      font-size: 0.68rem;
    }

    .action-btn:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--accent);
    }

    .action-btn:active {
      transform: translateY(1px);
    }

    kbd {
      background: #1e2433;
      border: 1px solid #333c52;
      color: #cbd5e1;
      padding: 1px 3px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 0.60rem;
      font-weight: 600;
      pointer-events: none;
    }

    .stage {
      flex: 1 1 0%;
      min-height: 0;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    .player-section {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
      background: #000;
      position: relative;
    }

    /* Fixed 16:9 Letterboxed Stage */
    .video-viewport {
      flex: 1 1 0%;
      min-height: 0;
      position: relative;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-ratio-box {
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (16 / 9));
      max-height: calc(100vw * (9 / 16));
      aspect-ratio: 16 / 9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #fullscreen-gate {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.65);
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: opacity 0.25s ease;
    }

    #fullscreen-gate .btn {
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 9999px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    #app.hide-cursor {
      cursor: none;
    }

    /* Channel Sidebar */
    .sidebar {
      position: absolute;
      top: var(--bar-h) !important;
      right: 0;
      bottom: 0 !important;
      width: var(--sidebar-w);
      min-height: 0;
      background-color: rgba(17, 20, 29, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 85;
      transform: translateX(100%);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.24s ease;
      box-shadow: -8px 0 28px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    .sidebar.visible {
      transform: translateX(0);
      pointer-events: auto;
    }

    .sidebar-header {
      height: 24px;
      padding: 0 8px;
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .channel-list {
      flex: 1 1 0%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: hidden;
      padding: 2px 4px 6px;
      gap: 1px;
    }

    .flag-divider {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 6px;
      margin: 2px 0 0;
      flex-shrink: 0;
      opacity: 0.9;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .flag-left {
      display: inline-flex;
      align-items: center;
    }

    .flag-icon {
      width: 15px;
      height: 10px;
      border-radius: 1.5px;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
      display: inline-block;
      flex-shrink: 0;
      pointer-events: none;
    }

    .flag-shortcut {
      font-size: 0.58rem;
      padding: 0 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 5px;
      border-radius: 3px;
      cursor: pointer;
      transition: background-color 0.1s ease;
      border: 1px solid transparent;
      height: var(--row-h);
      min-height: 14px;
      flex: 1 1 0%;
      line-height: 1;
    }

    .channel-item:hover {
      background-color: var(--bg-card);
    }

    .channel-item.active {
      background-color: var(--bg-card);
      border-color: var(--accent);
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .ch-logo-wrap {
      height: 75%;
      max-height: 16px;
      aspect-ratio: 4 / 3;
      border-radius: 2px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      padding: 1px;
      pointer-events: none;
    }

    .ch-logo-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .ch-name {
      flex: 1;
      min-width: 0;
      font-size: 0.70rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .toast-msg {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .toast-msg.show {
      opacity: 1;
    }

    /* Mobile Landscape */
    @media (orientation: landscape) and (max-height: 500px), (orientation: landscape) and (max-width: 950px) {
      .unified-top-bar {
        display: none !important;
      }

      .stage {
        flex-direction: row !important;
        width: 100% !important;
        height: 100% !important;
      }

      .player-section {
        flex: 0 0 auto !important;
        width: auto !important;
        height: 100% !important;
      }

      .video-viewport {
        width: auto !important;
        height: 100% !important;
        justify-content: flex-start !important;
      }

      .video-ratio-box {
        height: 100% !important;
        width: calc(100vh * (16 / 9)) !important;
        max-width: calc(100vw - 180px) !important;
        aspect-ratio: 16 / 9 !important;
      }

      .sidebar {
        position: static !important;
        top: 0 !important;
        bottom: 0 !important;
        transform: none !important;
        pointer-events: auto !important;
        box-shadow: none !important;
        border-left: 1px solid var(--border);
        flex: 1 1 0% !important;
        width: auto !important;
        height: 100% !important;
      }

      .sidebar-header {
        display: none;
      }

      .channel-list {
        overflow-y: hidden !important;
      }
    }

    /* Mobile Portrait */
    @media (orientation: portrait) and (max-width: 768px) {
      #app {
        flex-direction: column !important;
      }

      .unified-top-bar {
        position: static !important;
        transform: none !important;
        opacity: 1 !important;
        height: auto !important;
        min-height: 74px;
        padding: 4px 6px !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 4px !important;
      }

      .top-row-1 {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .top-row-2 {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        overflow-x: auto;
      }

      .brand-signal {
        gap: 6px;
      }

      .np-title {
        max-width: 140px;
        font-size: 0.74rem;
      }

      .top-controls {
        gap: 3px;
        flex-wrap: nowrap;
        width: 100%;
        justify-content: space-between;
      }

      .top-controls .action-btn {
        height: 26px;
        padding: 0 5px;
        font-size: 0.65rem;
      }

      .top-controls .vol-group {
        padding: 1px 3px;
      }

      .top-controls .vol-indicator {
        min-width: 28px;
        font-size: 0.65rem;
      }

      .stage {
        flex-direction: column !important;
        width: 100% !important;
        flex: 1 1 0% !important;
      }

      .player-section {
        flex: 0 0 auto !important;
        width: 100% !important;
        height: auto !important;
      }

      .video-viewport {
        width: 100% !important;
        height: auto !important;
        align-items: flex-start !important;
      }

      .video-ratio-box {
        width: 100% !important;
        height: auto !important;
        max-height: calc(100vw * (9 / 16)) !important;
        aspect-ratio: 16 / 9 !important;
      }

      .sidebar {
        position: static !important;
        top: auto !important;
        bottom: 0 !important;
        transform: none !important;
        pointer-events: auto !important;
        box-shadow: none !important;
        border-left: none;
        border-top: 1px solid var(--border);
        width: 100% !important;
        flex: 1 1 0% !important;
        height: auto !important;
      }

      .sidebar-header {
        height: 18px;
        padding: 0 6px;
        font-size: 0.58rem;
      }

      .channel-list {
        overflow-y: hidden !important;
      }
    }
  </style>
</head>
<body>

  <!-- Reusable SVG Flags -->
  <svg style="display: none;">
    <defs>
      <!-- English -->
      <g id="flag-en">
        <svg viewBox="0 0 60 40" width="15" height="10">
          <defs>
            <clipPath id="split-tl"><polygon points="0,0 60,0 0,40"/></clipPath>
            <clipPath id="split-br"><polygon points="60,0 60,40 0,40"/></clipPath>
          </defs>
          <g clip-path="url(#split-tl)">
            <rect width="60" height="40" fill="#b22234"/>

            <rect width="24" height="21.5" fill="#3c3b6e"/>
            <circle cx="6" cy="5" r="1" fill="#fff"/>

            <circle cx="6" cy="16" r="1" fill="#fff"/>
            <circle cx="12" cy="16" r="1" fill="#fff"/>
            <circle cx="18" cy="16" r="1" fill="#fff"/>
          </g>

            <rect width="60" height="40" fill="#012169"/>

            <path d="M30,0 v40 M0,20 h60" stroke="#c8102e" stroke-width="6"/>

          <line x1="0" y1="40" x2="60" y2="0" stroke="#ffffff" stroke-width="1.2"/>
        </svg>
      </g>
      <!-- France -->
      <g id="flag-fr">
        <svg viewBox="0 0 60 40" width="15" height="10">
          <rect width="20" height="40" fill="#002395"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ed2939"/>
        </svg>
      </g>
      <!-- Spain -->
      <g id="flag-es">
        <svg viewBox="0 0 60 40" width="15" height="10">
          <rect width="60" height="40" fill="#aa151b"/><rect y="10" width="60" height="20" fill="#f1bf00"/>
        </svg>
      </g>
      <!-- Germany -->
      <g id="flag-de">
        <svg viewBox="0 0 60 40" width="15" height="10">
          <rect width="60" height="40" fill="#000"/><rect y="13.33" width="60" height="13.33" fill="#dd0000"/><rect y="26.66" width="60" height="13.34" fill="#ffce00"/>
        </svg>
      </g>
      <!-- Luxembourg -->
      <g id="flag-lu">
        <svg viewBox="0 0 60 40" width="15" height="10">
          <rect width="60" height="13.33" fill="#ea141d"/><rect y="13.33" width="60" height="13.33" fill="#fff"/><rect y="26.66" width="60" height="13.34" fill="#00a1de"/>
        </svg>
      </g>
      <!-- Italy -->
      <g id="flag-it">
        <svg viewBox="0 0 60 40" width="15" height="10">
          <rect width="20" height="40" fill="#009246"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ce2b37"/>
        </svg>
      </g>
      <!-- Türkiye -->
      <g id="flag-tr">
        <svg viewBox="0 0 60 40" width="15" height="10">
          <rect width="60" height="40" fill="#e30a17"/>
          <circle cx="23" cy="20" r="10" fill="#fff"/><circle cx="26" cy="20" r="8" fill="#e30a17"/>
          <polygon points="34,20 39,22 37,17 40,14 35,15 33,11 32,16 27,16 31,19 29,24" fill="#fff"/>
        </svg>
      </g>
      <!-- Zimbabwe -->
      <g id="flag-zw">
        <svg viewBox="0 0 60 40" width="15" height="10">
          <rect width="60" height="5.71" fill="#319241"/>
          <rect y="5.71" width="60" height="5.71" fill="#ffd200"/>
          <rect y="11.42" width="60" height="5.71" fill="#de2010"/>
          <rect y="17.13" width="60" height="5.74" fill="#000000"/>
          <rect y="22.87" width="60" height="5.71" fill="#de2010"/>
          <rect y="28.58" width="60" height="5.71" fill="#ffd200"/>
          <rect y="34.29" width="60" height="5.71" fill="#319241"/>
          <polygon points="0,0 24,20 0,40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
          <polygon points="8,15 9.8,20.5 15,20.5 10.8,23.5 12.4,28.5 8,25.5 3.6,28.5 5.2,23.5 1,20.5 6.2,20.5" fill="#de2010"/>
        </svg>
      </g>
    </defs>
  </svg>

  <div id="app">
    <!-- Top Bar -->
    <header class="unified-top-bar" id="unifiedTopBar">
      <div class="top-row-1">
        <div class="brand-signal">
          <div class="live-dot" title="AFL TV Live Stream"></div>
          <div class="np-info">
            <img id="npLogo" class="np-logo" src="" alt="Channel Logo">
            <div class="np-text">
              <div id="npTitle" class="np-title">Select channel</div>
              <div id="npCategory" class="np-category">
                <svg id="npFlag" class="flag-icon" style="display:none;"></svg>
                <span id="npCategoryText">-</span>
                <span id="npResBadge" class="res-badge">...</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="top-row-2">
        <div class="top-controls">
          <button class="action-btn" id="playPauseBtn">⏯ Play <kbd>Space</kbd></button>
          <button class="action-btn" id="prevChBtn">◀ Prev <kbd>◀</kbd></button>
          <button class="action-btn" id="nextChBtn"><kbd>▶</kbd> Next ▶</button>

          <div class="vol-group">
            <button class="action-btn btn-sm" id="volDownBtn" title="Volume Down [▼]">🔉 <kbd>▼</kbd></button>
            <div class="vol-indicator" id="volDisplay" title="Click to Mute/Unmute [M]"><span id="volPercent">100%</span> <kbd>M</kbd></div>
            <button class="action-btn btn-sm" id="volUpBtn" title="Volume Up [▲]">🔊 <kbd>▲</kbd></button>
          </div>

          <button class="action-btn" id="ccBtn" title="Toggle Subtitles / Captions [-]">💬 CC <kbd>-</kbd></button>
          <button class="action-btn" id="pipBtn" title="Picture in Picture [P]">⧉ PiP <kbd>P</kbd></button>
          <button class="action-btn" id="fsToggleBtn" title="Toggle Fullscreen [Enter / F11]">⛶ Fullscreen <kbd>Enter</kbd></button>
          <button class="action-btn" id="channelsBtn" title="Toggle Channels Drawer [C]">☰ Channels <kbd>C</kbd></button>
        </div>
      </div>
    </header>

    <div class="stage" id="stageContainer">
      <section class="player-section" id="playerContainer">
        <!-- 16:9 Letterboxed Viewport Structure -->
        <div class="video-viewport" id="viewport">
          <div class="video-ratio-box">

    function setVolumeDelta(delta) {
      video.muted = false;
      const target = Math.min(1, Math.max(0, video.volume + delta));
      video.volume = Number(target.toFixed(2));
      updateVolumeDisplay();
      showToast(`Volume: ${Math.round(video.volume * 100)}%`);
    }

    function toggleMute() {
      video.muted = !video.muted;
      updateVolumeDisplay();
      showToast(video.muted ? 'Muted' : `Volume: ${Math.round(video.volume * 100)}%`);
    }

    function toggleCaptions() {
      if (currentHls && currentHls.subtitleTracks && currentHls.subtitleTracks.length > 0) {
        const nextTrack = (currentHls.subtitleTrack + 2) % (currentHls.subtitleTracks.length + 1) - 1;
        currentHls.subtitleTrack = nextTrack;
        const trackName = nextTrack === -1 ? 'Off' : (currentHls.subtitleTracks[nextTrack].name || `Track ${nextTrack + 1}`);
        showToast(`Subtitles: ${trackName}`);
      } else if (video.textTracks && video.textTracks.length > 0) {
        let activeIdx = -1;
        for (let i = 0; i < video.textTracks.length; i++) {
          if (video.textTracks[i].mode === 'showing') {
            activeIdx = i;
            video.textTracks[i].mode = 'disabled';
          }
        }
        const nextIdx = activeIdx + 1;
        if (nextIdx < video.textTracks.length) {
          video.textTracks[nextIdx].mode = 'showing';
          showToast(`Subtitles: ${video.textTracks[nextIdx].label || `Track ${nextIdx + 1}`}`);
        } else {
          showToast('Subtitles: Off');
        }
      } else {
        showToast('Subtitles: Not available');
      }
    }

    async function togglePictureInPicture() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled && video !== document.pictureInPictureElement) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        console.warn("PiP mode could not be activated:", err);
      }
    }

    function updateActualResolutionBadge() {
      const h = video.videoHeight;
      if (h && h > 0) {
        let label = `${h}p`;
        if (h >= 2160) label = '4K';
        else if (h >= 1440) label = '1440p';
        else if (h >= 1080) label = '1080p';
        else if (h >= 720) label = '720p';
        else if (h >= 576) label = '576p';
        else if (h >= 480) label = '480p';

        npResBadge.textContent = label;
        npResBadge.classList.add('active');
      } else {
        npResBadge.classList.remove('active');
      }
    }

    video.addEventListener('resize', updateActualResolutionBadge);
    video.addEventListener('loadedmetadata', updateActualResolutionBadge);
    video.addEventListener('volumechange', updateVolumeDisplay);

    function updateActiveItemStyles() {
      document.querySelectorAll('.channel-item').forEach(el => {
        const itemIdx = parseInt(el.getAttribute('data-index'), 10);
        if (itemIdx === activeIndex) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
    }

    function adjustChannelRowSizes() {
      const containerHeight = channelListEl.clientHeight;
      const totalItems = channelListEl.querySelectorAll('.channel-item').length;
      const totalDividers = channelListEl.querySelectorAll('.flag-divider').length;

      if (totalItems > 0 && containerHeight > 0) {
        const dividerSpace = totalDividers * 15;
        const availableForItems = Math.max(containerHeight - dividerSpace - 4, 40);
        const calculatedRowH = Math.floor(availableForItems / totalItems);
        const clampedH = Math.min(Math.max(calculatedRowH, 13), 26);
        document.documentElement.style.setProperty('--row-h', `${clampedH}px`);
      }
    }

    function renderChannels() {
      channelListEl.innerHTML = '';
      let totalMatched = 0;

      const countryGroups = {};
      CHANNELS.forEach((ch, idx) => {
        if (ch.isAvailable === false && ch.validated) return;
        if (!countryGroups[ch.country]) countryGroups[ch.country] = [];
        countryGroups[ch.country].push({ ...ch, originalIndex: idx });
      });

      Object.keys(countryGroups).forEach((countryKey) => {
        const meta = COUNTRY_META[countryKey] || { flagId: "", key: "" };
        let channels = countryGroups[countryKey];

        if (countryKey !== 'TR' && countryKey !== 'SPECIAL') {
          channels.sort((a, b) => {
            if (a.pinnedTop) return -1;
            if (b.pinnedTop) return 1;
            return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
          });
        }

        if (channels.length > 0) {
          totalMatched += channels.length;

          if (meta.flagId) {
            const flagDiv = document.createElement('div');
            flagDiv.className = 'flag-divider';
            flagDiv.innerHTML = `
              <div class="flag-left">
                <svg class="flag-icon"><use href="${meta.flagId}"/></svg>
              </div>
              ${meta.key ? `<kbd class="flag-shortcut">${meta.key}</kbd>` : ''}
            `;
            channelListEl.appendChild(flagDiv);
          }

          channels.forEach(ch => {
            const item = document.createElement('div');
            item.className = `channel-item ${ch.originalIndex === activeIndex ? 'active' : ''}`;
            item.setAttribute('data-index', ch.originalIndex);
            item.title = ch.name;
            item.innerHTML = `
              <div class="ch-logo-wrap">
                <img src="${ch.logo}" alt="${ch.name}" loading="lazy">
              </div>
              <div class="ch-name">${ch.name}</div>
            `;
            item.addEventListener('click', (e) => {
              e.stopPropagation();
              loadChannel(ch.originalIndex);
              hideSidebarImmediately();
            });
            channelListEl.appendChild(item);
          });
        }
      });

      channelCount.textContent = `Channels (${totalMatched})`;
      adjustChannelRowSizes();
    }

    function failoverToNextStream(ch) {
      if (ch.urls && ch.urls.length > 1) {
        const currIdx = ch.urls.indexOf(ch.url);
        const nextUrl = ch.urls[(currIdx + 1) % ch.urls.length];
        if (nextUrl !== ch.url) {
          ch.url = nextUrl;
          if (currentHls) {
            currentHls.loadSource(ch.url);
          } else {
            video.src = ch.url;
            video.play().catch(() => {});
          }
          return true;
        }
      }
      return false;
    }

    function loadChannel(index) {
      if (index < 0) index = CHANNELS.length - 1;
      if (index >= CHANNELS.length) index = 0;
      activeIndex = index;

      const ch = CHANNELS[index];
      const meta = COUNTRY_META[ch.country] || { flagId: "" };

      npTitle.textContent = ch.name;
      npCategoryText.textContent = ch.group;
      if (meta.flagId) {
        npFlag.innerHTML = `<use href="${meta.flagId}"/>`;
        npFlag.style.display = 'inline-block';
      } else {
        npFlag.style.display = 'none';
      }
      npLogo.src = ch.logo;
      npResBadge.classList.remove('active');

      updateActiveItemStyles();

      if (Hls.isSupported()) {
        if (currentHls) currentHls.destroy();
        currentHls = new Hls({ 
          enableWorker: true, 
          lowLatencyMode: true,
          capLevelToPlayerSize: true,
          backBufferLength: 90
        });

        currentHls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch(data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                if (!failoverToNextStream(ch)) currentHls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                currentHls.recoverMediaError();
                break;
              default:
                if (!failoverToNextStream(ch)) {
                  currentHls.destroy();
                  browseChannel(1);
                }
                break;
            }
          }
        });

        currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (currentHls.levels && currentHls.levels.length > 0) {
            let max1080pIndex = -1;
            for (let i = 0; i < currentHls.levels.length; i++) {
              if (currentHls.levels[i].height <= 1080) {
                max1080pIndex = i;
              }
            }
            if (max1080pIndex !== -1) {
              currentHls.currentLevel = max1080pIndex;
            }
          }
          video.play().catch(() => {});
        });

        currentHls.on(Hls.Events.LEVEL_SWITCHED, () => {
          setTimeout(updateActualResolutionBadge, 200);
        });

        currentHls.loadSource(ch.url);
        currentHls.attachMedia(video);

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        if (currentHls) {
          currentHls.destroy();
          currentHls = null;
        }
        video.src = ch.url;
        video.play().catch(() => {});
      }
    }

    function browseChannel(direction) {
      let nextIndex = activeIndex;
      for (let i = 0; i < CHANNELS.length; i++) {
        nextIndex = (nextIndex + direction + CHANNELS.length) % CHANNELS.length;
        const candidate = CHANNELS[nextIndex];
        if (!candidate.skipOnBrowse && (candidate.isAvailable || candidate.isAvailable === undefined)) {
          loadChannel(nextIndex);
          return;
        }
      }
      loadChannel(nextIndex);
    }

    function cycleCountryCategory(countryCode) {
      const countryIndices = [];
      CHANNELS.forEach((ch, idx) => {
        if (ch.country === countryCode && ch.isAvailable !== false) {
          countryIndices.push(idx);
        }
      });

      if (countryIndices.length === 0) return;

      const currentPos = countryIndices.indexOf(activeIndex);
      if (currentPos !== -1) {
        const nextPos = (currentPos + 1) % countryIndices.length;
        loadChannel(countryIndices[nextPos]);
      } else {
        loadChannel(countryIndices[0]);
      }
    }

    function extractMaxHeightFromPlaylist(text) {
      const matches = [...text.matchAll(/RESOLUTION=\d+x(\d+)/gi)];
      if (matches.length > 0) {
        return Math.max(...matches.map(m => parseInt(m[1], 10)));
      }
      return 720;
    }

    async function probeStreamQuality(url) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);
        const res = await fetch(url, { method: 'GET', mode: 'cors', cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) return { ok: false, height: 0, url };
        const text = await res.text();
        return { ok: true, height: extractMaxHeightFromPlaylist(text), url };
      } catch (err) {
        return { ok: false, height: 0, url };
      }
    }

    async function validateAllStreams() {
      const probePromises = CHANNELS.map(async (ch) => {
        if (ch.urls && ch.urls.length > 0) {
          const results = await Promise.all(ch.urls.map(u => probeStreamQuality(u)));
          const working = results.filter(r => r.ok).sort((a, b) => b.height - a.height);
          if (working.length > 0) {
            ch.url = working[0].url;
            ch.isAvailable = true;
          } else {
            ch.isAvailable = false;
          }
        } else {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3500);
            const response = await fetch(ch.url, { method: 'GET', mode: 'cors', cache: 'no-store', signal: controller.signal });
            clearTimeout(timeoutId);
            ch.isAvailable = response.ok;
          } catch (err) {
            ch.isAvailable = false;
          }
        }
        ch.validated = true;
      });

      await Promise.allSettled(probePromises);
      renderChannels();

      if (CHANNELS[activeIndex] && CHANNELS[activeIndex].isAvailable === false) {
        browseChannel(1);
      } else if (activeIndex === 0) {
        loadChannel(0);
      }
    }

    function isFullscreen() {
      return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function toggleFullscreen() {
      video.muted = false;

      if (!isFullscreen()) {
        const target = appContainer;
        if (target.requestFullscreen) target.requestFullscreen().catch(() => {});
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    function togglePlayPause() {
      if (video.paused) {
        video.play().catch(() => {});
        playPauseBtn.innerHTML = '⏸ Pause <kbd>Space</kbd>';
      } else {
        video.pause();
        playPauseBtn.innerHTML = '⏯ Play <kbd>Space</kbd>';
      }
    }

    function handleMouseMove(e) {
      const windowWidth = window.innerWidth;

      appContainer.classList.remove('hide-cursor');
      clearTimeout(cursorTimeout);
      cursorTimeout = setTimeout(() => {
        if (!sidebar.classList.contains('visible') && !unifiedTopBar.matches(':hover')) {
          appContainer.classList.add('hide-cursor');
        }
      }, 2500);

      if (isFullscreen() && windowWidth > 900) {
        if (e.clientY <= 50 || unifiedTopBar.matches(':hover')) {
          unifiedTopBar.classList.add('reveal-top');
        } else {
          unifiedTopBar.classList.remove('reveal-top');
        }
      }

      if (windowWidth > 900) {
        const sidebarWidth = 220;
        const triggerThreshold = sidebarWidth / 2;

        if (e.clientX >= (windowWidth - triggerThreshold) || sidebar.matches(':hover')) {
          showSidebar();
        } else if (sidebar.classList.contains('visible')) {
          if (e.clientX < (windowWidth - sidebarWidth)) {
            scheduleHideSidebar();
          }
        }
      }
    }

    function showSidebar() {
      clearTimeout(sidebarHideTimeout);
      sidebar.classList.add('visible');
    }

    function scheduleHideSidebar() {
      if (window.innerWidth <= 900) return;
      clearTimeout(sidebarHideTimeout);
      sidebarHideTimeout = setTimeout(() => {
        sidebar.classList.remove('visible');
      }, 1200);
    }

    function hideSidebarImmediately() {
      if (window.innerWidth <= 900) return;
      clearTimeout(sidebarHideTimeout);
      sidebar.classList.remove('visible');
    }

    viewport.addEventListener('click', (e) => {
      if (e.target.closest('#fullscreen-gate') || e.target.closest('#sidebar')) {
        return;
      }
      if (sidebar.classList.contains('visible') && window.innerWidth > 900) {
        hideSidebarImmediately();
      }
    });

    window.addEventListener('mousemove', handleMouseMove);
    sidebar.addEventListener('mouseenter', showSidebar);
    sidebar.addEventListener('mouseleave', scheduleHideSidebar);

    document.addEventListener('fullscreenchange', () => {
      if (!isFullscreen()) {
        unifiedTopBar.classList.remove('reveal-top');
        appContainer.classList.remove('hide-cursor');
      }
      setTimeout(adjustChannelRowSizes, 100);
    });

    window.addEventListener('resize', adjustChannelRowSizes);
    window.addEventListener('orientationchange', () => {
      setTimeout(adjustChannelRowSizes, 150);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (sidebar.classList.contains('visible') && window.innerWidth > 900) {
          hideSidebarImmediately();
          return;
        }
        if (isFullscreen()) {
          toggleFullscreen();
          return;
        }
      }

      if (e.key === 'F11' || e.key === 'Enter') {
        e.preventDefault();
        if (gate.style.display !== 'none') {
          gate.click();
        } else {
          toggleFullscreen();
        }
        return;
      }

      if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        toggleCaptions();
        return;
      }

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
        return;
      }

      if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePictureInPicture();
        return;
      }

      if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        toggleMute();
        return;
      }

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        browseChannel(-1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        browseChannel(1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setVolumeDelta(0.05);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        setVolumeDelta(-0.05);
      } 
      // Category cycling
      else if (e.key === 'e' || e.key === 'E') {
        e.preventDefault();
        cycleCountryCategory('EN');
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        cycleCountryCategory('FR');
      } else if (e.key === 's' || e.key === 'S') {
        e.preventDefault();
        cycleCountryCategory('ES');
      } else if (e.key === 'd' || e.key === 'D' || e.key === 'g' || e.key === 'G') {
        e.preventDefault();
        cycleCountryCategory('DE');
      } else if (e.key === 'l' || e.key === 'L') {
        e.preventDefault();
        cycleCountryCategory('LU');
      } else if (e.code === 'KeyI' || e.key === 'i' || e.key === 'I' || e.key === 'İ' || e.key === 'ı') {
        e.preventDefault();
        cycleCountryCategory('IT');
      } else if (e.key === 't' || e.key === 'T') {
        e.preventDefault();
        cycleCountryCategory('TR');
      } else if (e.key === 'z' || e.key === 'Z') {
        e.preventDefault();
        cycleCountryCategory('SPECIAL');
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        sidebar.classList.toggle('visible');
      }
    });

    gate.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreen();
      gate.style.opacity = '0';
      setTimeout(() => { gate.style.display = 'none'; }, 250);
    });

    fsToggleBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });
    pipBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePictureInPicture(); });
    ccBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleCaptions(); });
    channelsBtn.addEventListener('click', (e) => { e.stopPropagation(); sidebar.classList.toggle('visible'); });
    playPauseBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlayPause(); });
    prevChBtn.addEventListener('click', (e) => { e.stopPropagation(); browseChannel(-1); });
    nextChBtn.addEventListener('click', (e) => { e.stopPropagation(); browseChannel(1); });
    volDownBtn.addEventListener('click', (e) => { e.stopPropagation(); setVolumeDelta(-0.05); });
    volUpBtn.addEventListener('click', (e) => { e.stopPropagation(); setVolumeDelta(0.05); });
    volDisplay.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });

    sidebar.addEventListener('click', (e) => e.stopPropagation());

    // Bootstrap
    renderChannels();
    loadChannel(0);
    updateVolumeDisplay();
    validateAllStreams();
    setTimeout(adjustChannelRowSizes, 150);
  </script>
</body>
</html>
